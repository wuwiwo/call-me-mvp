<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- 主题防闪：与 index.html 同一段逻辑（两处保持一致），
             在 CSS 渲染前把持久化的主题同步写到 <html data-theme>。
             合法性由 theme.init() 最终裁定，详见 index.html 同位置注释。 -->
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem('appTheme');
                    if (typeof raw === 'string' && /^[a-zA-Z0-9_-]{1,32}$/.test(raw)) {
                        document.documentElement.setAttribute('data-theme', raw);
                    }
                } catch (e) {
                    /* storage 不可访问（隐私模式等）：保持默认主题 */
                }
            })();
        </script>
        <title>通知历史</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link href="./index.css?3.3" rel="stylesheet" />
        <link rel="stylesheet" href="./history.css" />
    </head>

    <body>
        <div class="top-bar">
            <div class="user-info">
                <!-- 以下静态文案由 js/modules/history.js 按 appLanguage 覆盖。
                 这里保留中文默认值，作为脚本执行前/执行失败时的回退 ——
                 与 index.html 对 title/subtitle 的处理方式一致。 -->
                <div id="historyBack" class="icon-btn" title="返回">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <span id="historyTitle">通知历史</span>
            </div>
            <!-- 添加清除按钮 -->
            <button id="clearHistory" class="icon-btn" title="清除记录">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>

        <div class="container">
            <div class="history-list" id="historyList">
                <!-- 动态生成历史记录 -->
            </div>
        </div>

        <!-- 在history.html中添加 -->
        <script type="module">
            import { history } from './js/modules/history.js';

            document.addEventListener('DOMContentLoaded', () => {
                history.init({
                    list: document.getElementById('historyList'),
                    backBtn: document.getElementById('historyBack'),
                    clearBtn: document.getElementById('clearHistory'),
                    topTitleEl: document.getElementById('historyTitle')
                });
            });
        </script>
    </body>
</html>
